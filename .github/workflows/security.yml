name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          global-json-file: backend/global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || 'none' }}
          queries: security-extended
      - name: Build backend for extraction
        if: matrix.language == 'csharp'
        run: |
          dotnet restore backend/Sensei.sln --locked-mode
          dotnet build backend/Sensei.sln --configuration Release --no-restore
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # Restore warnings (including all transitive audit severities and unavailable
      # audit sources) are errors under Directory.Build.props.
      - run: dotnet restore backend/Sensei.sln --locked-mode --force-evaluate
      - name: Save backend advisory report
        run: dotnet package list --project backend/Sensei.sln --include-transitive --vulnerable --format json --no-restore > nuget-audit.json
      - run: npm ci
        working-directory: client
      - name: Audit all locked client dependencies
        run: npm audit --audit-level=low --json > ../npm-audit.json
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: |
            nuget-audit.json
            npm-audit.json
